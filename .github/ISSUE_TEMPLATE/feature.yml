name: Feature Request
description: 提议新功能或改进
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        告诉我们你想加什么功能。**先搜一下现有 Issues**，避免重复提议。
  - type: textarea
    id: problem
    attributes:
      label: 你要解决什么问题？
      description: 描述你遇到的痛点或场景
      placeholder: |
        我经常需要在浏览器里快速比较两个 JSON 的差异，
        现在每次都要 ...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 你期望的解决方案
      description: 你觉得应该怎么实现？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 还有其他实现方式吗？
  - type: dropdown
    id: scope
    attributes:
      label: 范围
      options:
        - 纯前端工具（不需后端）
        - 需要后端支持
        - 协作功能
        - 文档转换
        - 不确定
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: 其他信息
      description: 截图、原型、相关链接等
