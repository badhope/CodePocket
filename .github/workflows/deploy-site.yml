name: Deploy Site

# 把 site/ 发布到 GitHub Pages。站点首次开启需在仓库
# Settings → Pages 中将 Source 设为 GitHub Actions（一次性手动操作）。
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  # 不要声明 administration:write —— 用户账号仓库的 GITHUB_TOKEN 不支持该权限键，
  # 会导致 workflow 启动失败（Invalid workflow file）。站点首次开启需在
  # 仓库 Settings → Pages 中将 Source 设为 GitHub Actions。

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Wait for Pages artifact indexing
        run: sleep 8

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
