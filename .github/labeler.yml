# Labeler config: maps file changes to PR labels
# Format reference: https://github.com/actions/labeler/blob/v5/README.md

ci:
  - changed-files:
      - any-glob-to-any-file:
          - .github/**
          - .gitleaks.toml

docs:
  - changed-files:
      - any-glob-to-any-file:
          - "**/*.md"
          - CHANGELOG.md
          - README.md
          - SECURITY.md
          - CONTRIBUTING.md

security:
  - changed-files:
      - any-glob-to-any-file:
          - .gitleaks.toml
          - SECURITY.md
          - src/lib/auth/**
          - src/lib/api/ratelimit.ts

infra:
  - changed-files:
      - any-glob-to-any-file:
          - infra/**
          - docker-compose.yml
          - Dockerfile*
          - Makefile

database:
  - changed-files:
      - any-glob-to-any-file:
          - drizzle/**
          - src/lib/db/**
          - scripts/db-*.sh

ui:
  - changed-files:
      - any-glob-to-any-file:
          - src/app/**
          - src/components/**
          - src/messages/**
          - public/**

tools:
  - changed-files:
      - any-glob-to-any-file:
          - src/lib/tools/**
          - src/lib/convert/**

execution:
  - changed-files:
      - any-glob-to-any-file:
          - src/lib/execution/**
          - infra/piston-shim/**

collab:
  - changed-files:
      - any-glob-to-any-file:
          - src/lib/collab/**
          - infra/collab-server/**

dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - package.json
          - pnpm-lock.yaml
          - pnpm-workspace.yaml

breaking:
  - changed-files:
      - any-glob-to-any-file:
          - "**/*.ts"
          - "**/*.tsx"
