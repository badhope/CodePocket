# Labeler config: maps file changes to PR labels
ci:
  - .github/**
  - .gitleaks.toml

docs:
  - "**/*.md"
  - CHANGELOG.md
  - README.md
  - SECURITY.md
  - CONTRIBUTING.md

security:
  - .gitleaks.toml
  - SECURITY.md
  - src/lib/auth/**
  - src/lib/api/ratelimit.ts

infra:
  - infra/**
  - docker-compose.yml
  - Dockerfile*
  - Makefile

database:
  - drizzle/**
  - src/lib/db/**
  - scripts/db-*.sh

ui:
  - src/app/**
  - src/components/**
  - src/messages/**
  - public/**

tools:
  - src/lib/tools/**
  - src/lib/convert/**

execution:
  - src/lib/execution/**
  - infra/piston-shim/**

collab:
  - src/lib/collab/**
  - infra/collab-server/**

dependencies:
  - package.json
  - pnpm-lock.yaml
  - pnpm-workspace.yaml

breaking:
  - "**/*.ts"
  - "**/*.tsx"
