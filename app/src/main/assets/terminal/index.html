<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <link rel="stylesheet" href="xterm.css">
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      background: #0b0e14;
      overflow: hidden;
      -webkit-user-select: none;
    }
    #term {
      box-sizing: border-box;
      width: 100%;
      height: 100%;
      padding: 6px;
    }
  </style>
</head>
<body>
  <div id="term"></div>

  <script src="xterm.js"></script>
  <script src="addon-fit.js"></script>
  <script>
    (function () {
      var darkTheme = location.search.indexOf('dark=0') < 0;
      var themes = {
        dark: {
          background: '#0b0e14',
          foreground: '#c9d1d9',
          cursor: '#7aa2f7',
          cursorAccent: '#0b0e14',
          selectionBackground: '#264f78',
          black: '#1b1f27', red: '#f7768e', green: '#9ece6a', yellow: '#e0af68',
          blue: '#7aa2f7', magenta: '#bb9af7', cyan: '#7dcfff', white: '#c9d1d9',
          brightBlack: '#414868', brightRed: '#ff7a93', brightGreen: '#b9f27c',
          brightYellow: '#ff9e64', brightBlue: '#7da6ff', brightMagenta: '#bb9af7',
          brightCyan: '#0db9d7', brightWhite: '#ffffff'
        },
        light: {
          background: '#f6f8fa',
          foreground: '#24292f',
          cursor: '#0969da',
          cursorAccent: '#f6f8fa',
          selectionBackground: '#b6d7ff',
          black: '#24292f', red: '#cf222e', green: '#116329', yellow: '#4d2d00',
          blue: '#0969da', magenta: '#8250df', cyan: '#1b7c83', white: '#6e7781',
          brightBlack: '#57606a', brightRed: '#a40e26', brightGreen: '#1a7f37',
          brightYellow: '#633c01', brightBlue: '#218bff', brightMagenta: '#a475f9',
          brightCyan: '#3192aa', brightWhite: '#8c959f'
        }
      };

      function applyTheme(dark) {
        darkTheme = !!dark;
        var theme = darkTheme ? themes.dark : themes.light;
        document.body.style.background = theme.background;
        document.getElementById('term').style.background = theme.background;
        if (window.term) window.term.options.theme = theme;
      }

      var term = new Terminal({
        cursorBlink: true,
        cursorStyle: 'block',
        fontFamily: 'monospace',
        fontSize: 13,
        lineHeight: 1.15,
        scrollback: 5000,
        convertEol: false,
        theme: darkTheme ? themes.dark : themes.light
      });

      var fitAddon = new FitAddon.FitAddon();
      term.loadAddon(fitAddon);
      term.open(document.getElementById('term'));
      window.term = term;
      applyTheme(darkTheme);

      var lastCols = 0;
      var lastRows = 0;

      function notifyResize() {
        try {
          fitAddon.fit();
        } catch (e) {
          // 容器尚未完成布局时忽略
        }
        if (term.cols !== lastCols || term.rows !== lastRows) {
          lastCols = term.cols;
          lastRows = term.rows;
          if (window.Android && Android.onResize) {
            Android.onResize(term.cols, term.rows);
          }
        }
      }

      term.onData(function (data) {
        if (window.Android && Android.onData) {
          Android.onData(data);
        }
      });

      window.addEventListener('resize', notifyResize);
      document.addEventListener('visibilitychange', function () {
        if (!document.hidden) notifyResize();
      });
      if (window.ResizeObserver) {
        new ResizeObserver(function () { notifyResize(); })
          .observe(document.getElementById('term'));
      }
      document.getElementById('term').addEventListener('click', function () {
        term.focus();
      });

      // Kotlin -> JS：base64 字节流直接交给 xterm，保留 UTF-8 与 ANSI 序列。
      window.termWriteB64 = function (b64) {
        var bin = atob(b64);
        var bytes = new Uint8Array(bin.length);
        for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        term.write(bytes);
      };

      window.termReset = function () { term.reset(); };
      window.termSetTheme = applyTheme;
      window.termFocus = function () { term.focus(); };
      window.termFit = notifyResize;

      setTimeout(function () {
        notifyResize();
        if (window.Android && Android.onReady) Android.onReady();
      }, 120);
    })();
  </script>
</body>
</html>
